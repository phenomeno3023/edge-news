name: EDGE NEWS collection

on:
  push:
    branches: [main]
    paths:
      - public/app.js
      - public/sw.js
      - src/export.js
      - src/schedule.js
      - src/news-window.js
      - src/collect.js
      - src/symbol-match.js
      - test/pwa.test.js
      - test/schedule.test.js
      - test/news-window.test.js
      - test/symbol-match.test.js
      - .github/workflows/edge-news.yml
  schedule:
    # KST 08:00-08:50 every day (UTC 23:00-23:50 every day).
    - cron: '0,10,20,30,40,50 23 * * *'
    # KST 09:00-19:30 on Mon-Fri (UTC 00:00-10:30 Mon-Fri).
    - cron: '0,30 0-10 * * 1-5'
    # KST 20:00 on Mon-Fri (UTC 11:00 Mon-Fri).
    - cron: '0 11 * * 1-5'
    # Hourly all week; the calendar gate keeps it for weekends/known holidays outside the morning sweep.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edge-news-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_HOLIDAYS: ${{ vars.KRX_HOLIDAYS }}
      KRX_CALENDAR_YEAR: ${{ vars.KRX_CALENDAR_YEAR }}
      EDGE_ACTIONS_TRIGGER: ${{ github.event_name }}
      EDGE_ACTIONS_SCHEDULE: ${{ github.event.schedule || '' }}
      EDGE_ACTIONS_RUN_ID: ${{ github.run_id }}
      EDGE_ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record actual workflow start
        shell: bash
        run: echo "EDGE_ACTIONS_STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Verify schedule and retention tests
        run: npm test
      - name: Decide collection window
        id: calendar
        run: node src/should-run.js
      - name: Restore compact collection state
        id: restore
        if: steps.calendar.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin refs/heads/edge-news-state >/dev/null 2>&1
          branch_check=$?
          set -e
          if [ "$branch_check" -eq 2 ]; then
            echo "No prior edge-news-state branch; importing the committed public news snapshot."
            node scripts/import-snapshot.js
            echo "EDGE_RESTORE_STATUS=first_run_snapshot_seeded" >> "$GITHUB_ENV"
            echo "status=first_run_snapshot_seeded" >> "$GITHUB_OUTPUT"
            {
              echo "### Collection state: first run"
              echo "No state branch existed. Seeded the database from the existing public/data/news.json snapshot before collection."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$branch_check" -ne 0 ]; then
            echo "::error::Could not verify edge-news-state branch existence (git ls-remote exit $branch_check). Collection stopped; existing stored state was not overwritten."
            echo "EDGE_RESTORE_STATUS=failed" >> "$GITHUB_ENV"
            exit 1
          fi
          if ! git fetch --no-tags origin edge-news-state; then
            echo "::error::State branch exists but could not be fetched. Collection stopped; no fresh database was created and the remote state branch was not changed."
            echo "EDGE_RESTORE_STATUS=failed" >> "$GITHUB_ENV"
            exit 1
          fi
          mkdir -p data
          if ! git show FETCH_HEAD:state/edge-news.sqlite > "$RUNNER_TEMP/edge-news.sqlite"; then
            echo "::error::State branch exists but its SQLite database is missing or unreadable. Collection stopped; remote state was not changed."
            echo "EDGE_RESTORE_STATUS=failed" >> "$GITHUB_ENV"
            exit 1
          fi
          if ! test -s "$RUNNER_TEMP/edge-news.sqlite" || ! node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync(process.argv[1]); const row=db.prepare('PRAGMA integrity_check').get(); db.close(); if(Object.values(row)[0]!=='ok') process.exit(1);" "$RUNNER_TEMP/edge-news.sqlite"; then
            echo "::error::Restored SQLite state failed integrity validation. Collection stopped; remote state was not changed."
            echo "EDGE_RESTORE_STATUS=failed" >> "$GITHUB_ENV"
            exit 1
          fi
          mv "$RUNNER_TEMP/edge-news.sqlite" data/edge-news.sqlite
          if git show FETCH_HEAD:state/krx_symbols.json > "$RUNNER_TEMP/krx_symbols.json"; then
            mv "$RUNNER_TEMP/krx_symbols.json" data/krx_symbols.json
          else
            echo "::warning::Prior symbol cache is missing; the collector will refresh the public KRX listing."
          fi
          echo "EDGE_RESTORE_STATUS=restored" >> "$GITHUB_ENV"
          echo "status=restored" >> "$GITHUB_OUTPUT"
          echo "Restored and integrity-checked the prior SQLite collection database."
          {
            echo "### Collection state: restored"
            echo "Prior SQLite state was fetched and passed SQLite integrity_check before collection."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mark final briefing run
        if: steps.calendar.outputs.run == 'true' && endsWith(steps.calendar.outputs.scheduled_for, 'T23:50:00.000Z')
        run: echo 'EDGE_FINAL_REPORT=true' >> "$GITHUB_ENV"
      - name: Collect public feeds and disclosures
        id: collect
        if: steps.calendar.outputs.run == 'true'
        run: node src/collect.js
      - name: Export mobile news snapshot
        id: export
        if: steps.calendar.outputs.run == 'true' && env.EDGE_COLLECTION_DUPLICATE != 'true'
        run: node src/export.js
      - name: Checkpoint and validate SQLite before persistence
        id: sqlite-check
        if: steps.calendar.outputs.run == 'true' && env.EDGE_COLLECTION_DUPLICATE != 'true'
        run: |
          node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync("data/edge-news.sqlite");
            const checkpoint = db.prepare("PRAGMA wal_checkpoint(TRUNCATE)").get();
            const integrity = db.prepare("PRAGMA integrity_check").get();
            const counts = {
              articles: db.prepare("SELECT COUNT(*) AS n FROM articles").get().n,
              runs: db.prepare("SELECT COUNT(*) AS n FROM runs").get().n,
              reports: db.prepare("SELECT COUNT(*) AS n FROM reports").get().n
            };
            db.close();
            const result = {checkpoint, integrity: Object.values(integrity)[0], counts};
            console.log(JSON.stringify(result));
            if (result.integrity !== "ok" || Number(checkpoint.busy) !== 0) process.exit(1);
          '
      - name: Prepare static snapshot and compact state branch
        id: persist
        if: steps.calendar.outputs.run == 'true' && env.EDGE_COLLECTION_DUPLICATE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-news-pages" "$RUNNER_TEMP/edge-news-state"
          cp -a public/. "$RUNNER_TEMP/edge-news-pages/"
          cp data/edge-news.sqlite "$RUNNER_TEMP/edge-news-state/edge-news.sqlite"
          if [ -f data/krx_symbols.json ]; then cp data/krx_symbols.json "$RUNNER_TEMP/edge-news-state/krx_symbols.json"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan edge-news-state
          git rm -rf . || true
          mkdir -p state
          cp "$RUNNER_TEMP/edge-news-state/edge-news.sqlite" state/edge-news.sqlite
          if [ -f "$RUNNER_TEMP/edge-news-state/krx_symbols.json" ]; then cp "$RUNNER_TEMP/edge-news-state/krx_symbols.json" state/krx_symbols.json; fi
          git add state
          git commit -m 'Update compact EDGE NEWS state'
          if ! git push --force origin HEAD:edge-news-state; then
            echo "::error::News collection completed but state persistence failed. The prior remote state remains intact; Pages publication was stopped to avoid publishing an unpersisted run."
            echo "### State persistence: failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### State persistence: saved" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
        if: steps.calendar.outputs.run == 'true' && env.EDGE_COLLECTION_DUPLICATE != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.calendar.outputs.run == 'true' && env.EDGE_COLLECTION_DUPLICATE != 'true'
        with:
          path: ${{ runner.temp }}/edge-news-pages
      - name: Deploy mobile web snapshot
        id: deployment
        if: steps.calendar.outputs.run == 'true' && env.EDGE_COLLECTION_DUPLICATE != 'true'
        uses: actions/deploy-pages@v4
      - name: Persist deployment outcome
        id: persist-deployment
        if: always() && steps.persist.outcome == 'success' && steps.calendar.outputs.run == 'true' && env.EDGE_COLLECTION_DUPLICATE != 'true'
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        shell: bash
        run: |
          node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync("state/edge-news.sqlite");
            const now = new Date().toISOString();
            db.prepare("UPDATE runs SET deployment_status=?, deployment_finished_at=? WHERE id=(SELECT MAX(id) FROM runs)").run(process.env.DEPLOY_OUTCOME === "success" ? "success" : process.env.DEPLOY_OUTCOME || "unknown", now);
            db.close();
          '
          git add state/edge-news.sqlite
          git commit -m 'Record EDGE NEWS deployment outcome'
          git push origin HEAD:edge-news-state
      - name: Record workflow outcomes
        if: always()
        env:
          CALENDAR_OUTCOME: ${{ steps.calendar.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          STATE_OUTCOME: ${{ steps.persist.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOY_STATE_OUTCOME: ${{ steps.persist-deployment.outcome }}
        shell: bash
        run: |
          {
            echo '### Workflow stage outcomes'
            echo "- Schedule decision step: $CALENDAR_OUTCOME"
            echo "- State restore: $RESTORE_OUTCOME"
            echo "- Collection: $COLLECT_OUTCOME"
            echo "- JSON generation: $EXPORT_OUTCOME"
            echo "- State persistence: $STATE_OUTCOME"
            echo "- Pages deployment: $DEPLOY_OUTCOME"
            echo "- Deployment status persistence: $DEPLOY_STATE_OUTCOME"
            echo "- Actual workflow start (UTC): $EDGE_ACTIONS_STARTED_AT"
            echo "- Cron expression: ${EDGE_ACTIONS_SCHEDULE:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

